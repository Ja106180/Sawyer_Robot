<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sawyer Control Cockpit</title>
    <!-- ROS Libraries -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Emergency Stop Button -->
    <button id="btn-estop" class="estop-btn">
        <span>🛑 EMERGENCY STOP</span>
    </button>
    <!-- Sidebar for Status & Modes -->
    <div class="sidebar">
        <div class="brand">
            <div class="logo-orb"></div>
            <h1>SAWYER <span>PRO</span></h1>
        </div>

        <div class="status-panel">
            <div class="status-item">
                <span>系统状态</span>
                <div id="connection-status" class="status-badge pulse">连接中...</div>
            </div>
        </div>

        <div class="nav-section">
            <div class="section-title">核心功能</div>
            <div class="mode-grid">
                <button id="btn-grasp" class="mode-card">
                    <span>视觉抓取</span>
                </button>
                <button id="btn-follow" class="mode-card">
                    <span>手臂跟随</span>
                </button>
            </div>
        </div>

        <div class="nav-section">
            <div class="section-title">数字盘视觉抓取</div>
            <!-- 第一步：启动后台服务 (这会进行初始化) -->
            <button id="btn-num-grasp-process" class="mode-card" style="width: 100%; margin-bottom: 10px;">
                <span>1. 启动数字抓取后台服务</span>
            </button>

            <!-- 第二步：发送数字指令 (可反复执行) -->
            <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                <select id="select-number" class="mode-card"
                    style="flex: 1; padding: 10px; font-size: 16px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;">
                    <option value="1">数字 1</option>
                    <option value="2">数字 2</option>
                    <option value="3">数字 3</option>
                    <option value="4">数字 4</option>
                    <option value="5">数字 5</option>
                    <option value="6">数字 6</option>
                    <option value="7">数字 7</option>
                    <option value="8">数字 8</option>
                    <option value="9">数字 9</option>
                </select>
                <button id="btn-send-number" class="mode-card" style="flex: 2; border-color: var(--primary);">
                    <span>2. 发送目标进行抓取</span>
                </button>
            </div>

            <!-- 第三步：跨盘遮挡搬运 -->
            <button id="btn-transfer-grasp" class="mode-card" style="width: 100%;">
                <span>3. 跨盘遮挡搬运 (Transfer)</span>
            </button>
        </div>

        <div class="nav-section">
            <div class="section-title">摄像头控制</div>
            <div class="mode-grid">
                <button id="btn-head-cam" class="mode-card">
                    <span>头部摄像头</span>
                </button>
                <button id="btn-hand-cam" class="mode-card">
                    <span>末端摄像头</span>
                </button>
            </div>
        </div>

        <div class="nav-section">
            <div class="section-title">夹爪控制</div>
            <button id="btn-gripper" class="action-btn">
                <span>切换夹爪</span>
            </button>
        </div>

        <div class="nav-section">
            <div class="section-title">复位控制</div>
            <button id="btn-reset" class="action-btn">
                <span>一键复位</span>
            </button>
        </div>
        <div class="nav-section">
            <div class="section-title">示教与回放 (Teach & Replay)</div>

            <div class="mode-grid" id="record-controls-idle">
                <button id="btn-record-start" class="mode-card" style="grid-column: span 2;">
                    <span>创建 (开始拖拽示教)</span>
                </button>
            </div>
            <div class="mode-grid" id="record-controls-active" style="display: none;">
                <button id="btn-record-save" class="mode-card"
                    style="border-color: var(--success); color: var(--success);">
                    <span>保存</span>
                </button>
                <button id="btn-record-cancel" class="mode-card"
                    style="border-color: var(--danger); color: var(--danger);">
                    <span>取消</span>
                </button>
            </div>

            <div class="teach-list-container">
                <div class="teach-list-header">已保存的动作序列</div>
                <div id="teach-actions-list" class="teach-list">
                    <!-- Action items injected by JS -->
                    <div style="padding: 10px; color: var(--text-secondary); text-align: center;">正在加载...</div>
                </div>
            </div>

            <div class="teach-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-loop-action" checked>
                    开启循环执行 (Loop)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-seq-action">
                    按序列执行多动作
                </label>
            </div>

            <div class="mode-grid" style="margin-top: 15px;">
                <button id="btn-play-start" class="action-btn play-btn">
                    <span>开启</span>
                </button>
                <button id="btn-play-stop" class="action-btn stop-btn">
                    <span>关闭</span>
                </button>
            </div>
        </div>

        <div class="log-panel">
            <div class="section-title">实时日志</div>
            <div id="debug-log">Ready...</div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <!-- Top Row: Video Feeds -->
        <div class="vision-row">
            <div class="video-container">
                <div class="video-overlay">头部摄像头</div>
                <img id="video-head" src="" alt="HEAD STREAM">
            </div>
            <div class="video-container">
                <div class="video-overlay">末端摄像头</div>
                <img id="video-hand" src="" alt="WRIST STREAM">
            </div>
        </div>

        <!-- Bottom Row: Multi-Control Hub -->
        <div class="control-hub">
            <!-- Left: Joysticks -->
            <div class="joystick-bay">
                <div class="joystick-card">
                    <div class="card-header">基座与肩部 (J0 / J1)</div>
                    <div id="joystick-base" class="joystick-zone"></div>
                </div>
                <div class="joystick-card">
                    <div class="card-header">肘部旋转 (J2 / J3)</div>
                    <div id="joystick-elbow" class="joystick-zone"></div>
                </div>
            </div>

            <!-- Right: Precise Tuning & Head -->
            <div class="precise-bay">
                <div class="glass-card">
                    <div class="card-header">精细调节 (Fine-tuning)</div>
                    <div class="sliders-grid">
                        <div class="slider-box">
                            <label>J4 Wrist <span><span id="val-j4">0.0</span> rad</span></label>
                            <input type="range" id="slip-j4" min="-2.97" max="2.97" step="0.01" value="0">
                        </div>
                        <div class="slider-box">
                            <label>J5 Wrist Rot <span><span id="val-j5">0.0</span> rad</span></label>
                            <input type="range" id="slip-j5" min="-2.97" max="2.97" step="0.01" value="1.5">
                        </div>
                        <div class="slider-box">
                            <label>J6 Hand <span><span id="val-j6">0.0</span> rad</span></label>
                            <input type="range" id="slip-j6" min="-4.7" max="4.7" step="0.01" value="0">
                        </div>
                    </div>
                </div>

                <div class="row-flex">
                    <div class="glass-card flex-1">
                        <div class="card-header">头部全景 (Pan)</div>
                        <div class="slider-box no-margin">
                            <input type="range" id="slip-head" min="-5.0" max="1.5" step="0.01" value="0">
                            <div class="val-display" id="val-head">0.00</div>
                        </div>
                    </div>
                    <div class="glass-card flex-1">
                        <div class="card-header">运行速度</div>
                        <div class="slider-box no-margin">
                            <input type="range" id="slip-speed" min="0.05" max="1.0" step="0.05" value="0.3">
                            <div class="val-display" id="val-speed">0.30</div>
                        </div>
                    </div>
                </div>

                <!-- Invisible backup sliders for J0-J3 so main.js logic doesn't break -->
                <div style="display:none">
                    <input type="range" id="slip-j0"><span id="val-j0"></span>
                    <input type="range" id="slip-j1"><span id="val-j1"></span>
                    <input type="range" id="slip-j2"><span id="val-j2"></span>
                    <input type="range" id="slip-j3"><span id="val-j3"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
